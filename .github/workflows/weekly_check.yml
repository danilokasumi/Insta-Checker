name: Weekly Instagram Unfollower Check

on:
  schedule:
    - cron: '0 20 * * 0'
  workflow_dispatch:

jobs:
  check-unfollowers:
    runs-on: ubuntu-latest

    steps:
    - name: Repo auschecken
      uses: actions/checkout@v3

    - name: Python einrichten
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Abhängigkeiten installieren
      run: |
        pip install google-api-python-client google-auth requests

    - name: Skript ausführen und E-Mail senden
      env:
        GDRIVE_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
      run: |
        python - << 'EOF'
        import os
        import json
        import io
        import zipfile
        import smtplib
        import time
        import requests
        from email.mime.text import MIMEText
        from email.mime.multipart import MIMEMultipart
        from google.oauth2.service_account import Credentials
        from googleapiclient.discovery import build
        from googleapiclient.http import MediaIoBaseDownload

        # 1. Google Drive Verbindung
        creds_data = json.loads(os.environ['GDRIVE_JSON'])
        creds = Credentials.from_service_account_info(creds_data, scopes=['https://www.googleapis.com/auth/drive.readonly'])
        service = build('drive', 'v3', credentials=creds)

        followers = set()
        following = set()

        def parse_json_content(content):
            data = json.loads(content)
            result = set()

            def extract_username(obj):
                if isinstance(obj, dict):
                    if 'value' in obj and obj['value']:
                        result.add(str(obj['value']).lower())
                    elif 'title' in obj and obj['title']:
                        result.add(str(obj['title']).lower())
                    for k, v in obj.items():
                        extract_username(v)
                elif isinstance(obj, list):
                    for item in obj:
                        extract_username(item)

            extract_username(data)
            return result

        def find_jsons_in_folder(folder_id):
            global followers, following
            query = f"'{folder_id}' in parents and mimeType='application/json' and trashed=false"
            files = service.files().list(q=query, fields="files(id, name)").execute().get('files', [])
            
            for jf in files:
                fname = jf['name'].lower()
                if 'followers' in fname or 'following' in fname:
                    print(f"Gefundene Datei: {jf['name']}")
                    file_data = service.files().get_media(fileId=jf['id']).execute()
                    parsed = parse_json_content(file_data.decode('utf-8'))
                    if 'followers' in fname:
                        followers.update(parsed)
                    if 'following' in fname:
                        following.update(parsed)

            subfolders_query = f"'{folder_id}' in parents and mimeType='application/vnd.google-apps.folder' and trashed=false"
            subfolders = service.files().list(q=subfolders_query, fields="files(id, name)").execute().get('files', [])
            
            for sf in subfolders:
                find_jsons_in_folder(sf['id'])

        # Suche nach Dateien/Ordnern
        results = service.files().list(
            q="mimeType='application/zip' or mimeType='application/x-zip-compressed' or mimeType='application/vnd.google-apps.folder'",
            orderBy="createdTime desc",
            pageSize=15,
            fields="files(id, name, mimeType)"
        ).execute()

        files = results.get('files', [])
        target_item = None
        for f in files:
            if f['name'] != 'Instagram-Exports':
                target_item = f
                break

        if not target_item:
            print("Keine Export-Datei oder -Ordner gefunden!")
            exit(0)

        print(f"Verarbeite Quelle: {target_item['name']} ({target_item['mimeType']})")

        if target_item['mimeType'] == 'application/vnd.google-apps.folder':
            find_jsons_in_folder(target_item['id'])
        else:
            request = service.files().get_media(fileId=target_item['id'])
            fh = io.BytesIO()
            downloader = MediaIoBaseDownload(fh, request)
            done = False
            while not done:
                status, done = downloader.next_chunk()
            fh.seek(0)

            with zipfile.ZipFile(fh, 'r') as z:
                for filename in z.namelist():
                    fname = filename.lower()
                    if ('followers' in fname or 'following' in fname) and fname.endswith('.json'):
                        content = z.read(filename).decode('utf-8')
                        parsed = parse_json_content(content)
                        if 'followers' in fname:
                            followers.update(parsed)
                        if 'following' in fname:
                            following.update(parsed)

        raw_unfollowers = sorted(list(following - followers))
        print(f"Gefundene Follower: {len(followers)}, Following: {len(following)}")
        print(f"Roh-Unfollower vor Live-Check: {len(raw_unfollowers)}")

        # 2. Live-Prüfung: Ist das Profil überhaupt noch aktiv?
        active_unfollowers = []
        headers = {
            'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
        }

        print("Starte Live-Prüfung auf deaktivierte/gelöschte Accounts...")
        for user in raw_unfollowers:
            try:
                url = f"https://www.instagram.com/{user}/"
                res = requests.get(url, headers=headers, timeout=5)
                # HTTP 404 = Seite nicht gefunden (Konto gelöscht oder deaktiviert)
                if res.status_code == 404:
                    print(f"-> @{user}: Account existiert nicht mehr (gelöscht/deaktiviert) -> Ausgeblendet")
                else:
                    active_unfollowers.append(user)
                time.sleep(0.5) # Kurze Pause, um Rate-Limits zu vermeiden
            except Exception as e:
                # Bei Verbindungsfehlern sicherheitshalber aufnehmen
                active_unfollowers.append(user)

        print(f"Echte, aktive Unfollower: {len(active_unfollowers)}")

        # 3. E-Mail versenden
        sender = os.environ['EMAIL_SENDER']
        receiver = os.environ['EMAIL_RECEIVER']
        password = os.environ['EMAIL_PASSWORD']

        msg = MIMEMultipart()
        msg['From'] = sender
        msg['To'] = receiver
        msg['Subject'] = f"Wöchentliches Insta-Update: {len(active_unfollowers)} Unfollower"

        if active_unfollowers:
            body = f"Folgende {len(active_unfollowers)} Personen folgen dir aktuell nicht zurück:\n\n"
            for user in active_unfollowers:
                body += f"- @{user} (https://instagram.com/{user})\n"
        else:
            body = "Super Nachrichten! Alle aktiven Personen, denen du folgst, folgen dir auch zurück 🎉"

        msg.attach(MIMEText(body, 'plain'))

        try:
            server = smtplib.SMTP_SSL('smtp.gmail.com', 465)
            server.login(sender, password)
            server.sendmail(sender, receiver, msg.as_string())
            server.close()
            print("E-Mail erfolgreich versendet!")
        except Exception as e:
            print(f"Fehler beim Mail-Versand: {e}")
            raise e
        EOF
