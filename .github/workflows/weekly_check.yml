name: Weekly Instagram Unfollower Check

on:
  schedule:
    # Startet jeden Sonntag um 20:00 Uhr UTC (22:00 Uhr deutscher Zeit)
    - cron: '0 20 * * 0'
  workflow_dispatch: # Ermöglicht das manuelle Starten per Button zum Testen

jobs:
  check-unfollowers:
    runs-on: ubuntu-latest

    steps:
    - name: Repo auschecken
      uses: actions/checkout@v3

    - name: Python einrichten
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Abhängigkeiten installieren
      run: |
        pip install google-api-python-client google-auth

    - name: Skript ausführen und E-Mail senden
      env:
        GDRIVE_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
      run: |
        python - << 'EOF'
        import os
        import json
        import io
        import zipfile
        import smtplib
        from email.mime.text import MIMEText
        from email.mime.multipart import MIMEMultipart
        from google.oauth2.service_account import Credentials
        from googleapiclient.discovery import build
        from googleapiclient.http import MediaIoBaseDownload

        # 1. Google Drive Verbindung
        creds_data = json.loads(os.environ['GDRIVE_JSON'])
        creds = Credentials.from_service_account_info(creds_data, scopes=['https://www.googleapis.com/auth/drive.readonly'])
        service = build('drive', 'v3', credentials=creds)

        # 2. Neueste ZIP-Datei aus Google Drive suchen
        results = service.files().list(
            q="mimeType='application/zip' or mimeType='application/x-zip-compressed'",
            orderBy="createdTime desc",
            pageSize=1,
            fields="files(id, name)"
        ).execute()

        files = results.get('files', [])
        if not files:
            print("Keine ZIP-Datei in Google Drive gefunden!")
            exit(0)

        file_id = files[0]['id']
        print(f"Lade neueste Datei herunter: {files[0]['name']}")

        # 3. ZIP herunterladen und im Speicher entpacken
        request = service.files().get_media(fileId=file_id)
        fh = io.BytesIO()
        downloader = MediaIoBaseDownload(fh, request)
        done = False
        while not done:
            status, done = downloader.next_chunk()

        fh.seek(0)
        
        followers = set()
        following = set()

        with zipfile.ZipFile(fh, 'r') as z:
            for filename in z.namelist():
                # Flexible Suche nach den JSON-Dateien im ZIP
                if 'followers' in filename.lower() and filename.endswith('.json'):
                    data = json.loads(z.read(filename))
                    for item in data:
                        if isinstance(item, dict) and 'string_list_data' in item:
                            for s in item['string_list_data']:
                                followers.add(s['value'].lower())
                
                if 'following' in filename.lower() and filename.endswith('.json'):
                    data = json.loads(z.read(filename))
                    raw_list = data.get('relationships_following', data)
                    for item in raw_list:
                        if isinstance(item, dict) and 'string_list_data' in item:
                            for s in item['string_list_data']:
                                following.add(s['value'].lower())

        # 4. Unfollower berechnen
        unfollowers = sorted(list(following - followers))

        # 5. E-Mail vorbereiten und senden
        sender = os.environ['EMAIL_SENDER']
        receiver = os.environ['EMAIL_RECEIVER']
        password = os.environ['EMAIL_PASSWORD']

        msg = MIMEMultipart()
        msg['From'] = sender
        msg['To'] = receiver
        msg['Subject'] = f"Wöchentliches Insta-Update: {len(unfollowers)} Unfollower"

        if unfollowers:
            body = "Folgende Personen folgen dir aktuell nicht zurück:\n\n"
            for user in unfollowers:
                body += f"- @{user} (https://instagram.com/{user})\n"
        else:
            body = "Super Nachrichten! Alle Personen, denen du folgst, folgen dir auch zurück 🎉"

        msg.attach(MIMEText(body, 'plain'))

        try:
            server = smtplib.SMTP_SSL('smtp.gmail.com', 465)
            server.login(sender, password)
            server.sendmail(sender, receiver, msg.as_string())
            server.close()
            print("E-Mail erfolgreich versendet!")
        except Exception as e:
            print(f"Fehler beim Mail-Versand: {e}")
        EOF
