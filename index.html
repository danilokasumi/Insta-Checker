<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insta Unfollower Checker</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #000; color: #fff; padding: 20px; margin: 0; }
        h1 { font-size: 22px; text-align: center; margin-bottom: 20px; color: #f5f5f5; }
        .box { background: #1c1c1e; border-radius: 12px; padding: 16px; margin-bottom: 15px; border: 1px solid #2c2c2e; }
        label { font-weight: bold; display: block; margin-bottom: 8px; font-size: 14px; color: #aaa; }
        input[type="file"] { display: block; width: 100%; color: #8e8e93; font-size: 14px; }
        button { width: 100%; background: #007aff; color: white; border: none; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: bold; margin-top: 10px; cursor: pointer; }
        button:active { background: #0056b3; }
        .results { margin-top: 20px; }
        ul { list-style-type: none; padding: 0; margin: 0; }
        li { background: #1c1c1e; padding: 12px 16px; border-radius: 10px; margin-bottom: 8px; font-size: 15px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #2c2c2e; }
        a { color: #3897f0; text-decoration: none; font-weight: bold; font-size: 13px; background: #2c2c2e; padding: 6px 12px; border-radius: 6px; }
        .stats-box { background: #1c1c1e; border: 1px solid #0a84ff; padding: 12px; border-radius: 10px; text-align: center; margin-bottom: 15px; font-size: 14px; color: #64d2ff; }
        .count { text-align: center; font-size: 15px; color: #ff453a; margin-bottom: 15px; font-weight: bold; }
        .error { color: #ff453a; background: #2c1c1c; padding: 12px; border-radius: 10px; margin-top: 10px; text-align: center; font-size: 14px; border: 1px solid #5a2222; }
    </style>
</head>
<body>

    <h1>Insta Unfollower Checker</h1>

    <div class="box">
        <label>1. Datei wählen: <code>followers_1.json</code></label>
        <input type="file" id="followersFile" accept=".json">
    </div>

    <div class="box">
        <label>2. Datei wählen: <code>following.json</code></label>
        <input type="file" id="followingFile" accept=".json">
    </div>

    <button onclick="analyze()">Präzise Auswerten</button>

    <div class="results" id="output"></div>

    <script>
        // Extrahiert gezielt Follower aus der Meta-Struktur
        function parseFollowers(data) {
            let set = new Set();
            let list = Array.isArray(data) ? data : [];
            list.forEach(item => {
                if (item.string_list_data && item.string_list_data.length > 0) {
                    let val = item.string_list_data[0].value;
                    if (val) set.add(val.toLowerCase().trim());
                }
            });
            return set;
        }

        // Extrahiert gezielt Gefolgte (schließt Anfragen & Hashtags aus)
        function parseFollowing(data) {
            let set = new Set();
            // Meta speichert Gefolgte entweder unter 'relationships_following' oder direkt als Array
            let list = data.relationships_following || (Array.isArray(data) ? data : []);
            
            list.forEach(item => {
                if (item.string_list_data && item.string_list_data.length > 0) {
                    let val = item.string_list_data[0].value;
                    if (val) set.add(val.toLowerCase().trim());
                }
            });
            return set;
        }

        async function analyze() {
            const fInput = document.getElementById('followersFile');
            const fgInput = document.getElementById('followingFile');
            const output = document.getElementById('output');

            output.innerHTML = '';

            if (!fInput.files[0] || !fgInput.files[0]) {
                output.innerHTML = '<div class="error">Bitte beide Dateien auswählen!</div>';
                return;
            }

            try {
                const fText = await fInput.files[0].text();
                const fgText = await fgInput.files[0].text();

                const followersData = JSON.parse(fText);
                const followingData = JSON.parse(fgText);

                const followersSet = parseFollowers(followersData);
                const followingSet = parseFollowing(followingData);

                let notFollowingBack = [];
                followingSet.forEach(user => {
                    if (!followersSet.has(user)) {
                        notFollowingBack.push(user);
                    }
                });

                notFollowingBack.sort();

                let statsHtml = `
                    <div class="stats-box">
                        Echte Follower in Datei: <b>${followersSet.size}</b><br>
                        Echte Gefolgte Konten: <b>${followingSet.size}</b>
                    </div>
                `;

                if (notFollowingBack.length === 0) {
                    output.innerHTML = statsHtml + '<div style="text-align:center; color:#30d158; font-weight:bold;">🎉 Alle Personen, denen du folgst, folgen dir auch zurück!</div>';
                } else {
                    let html = statsHtml + `<div class="count">${notFollowingBack.length} Personen folgen dir nicht zurück:</div><ul>`;
                    notFollowingBack.forEach(username => {
                        html += `<li>
                            <span>@${username}</span>
                            <a href="https://instagram.com/${username}" target="_blank" rel="noopener">Profil</a>
                        </li>`;
                    });
                    html += '</ul>';
                    output.innerHTML = html;
                }

            } catch (err) {
                output.innerHTML = `<div class="error">Fehler beim Verarbeiten: ${err.message}</div>`;
            }
        }
    </script>
</body>
</html>
