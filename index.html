<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insta Unfollower Checker</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #000; color: #fff; padding: 20px; margin: 0; }
        h1 { font-size: 22px; text-align: center; margin-bottom: 20px; color: #f5f5f5; }
        .box { background: #1c1c1e; border-radius: 12px; padding: 16px; margin-bottom: 15px; border: 1px solid #2c2c2e; }
        label { font-weight: bold; display: block; margin-bottom: 8px; font-size: 14px; color: #aaa; }
        input[type="file"] { display: block; width: 100%; color: #8e8e93; font-size: 14px; }
        button { width: 100%; background: #007aff; color: white; border: none; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: bold; margin-top: 10px; cursor: pointer; }
        button:active { background: #0056b3; }
        .results { margin-top: 20px; }
        ul { list-style-type: none; padding: 0; margin: 0; }
        li { background: #1c1c1e; padding: 12px 16px; border-radius: 10px; margin-bottom: 8px; font-size: 15px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #2c2c2e; }
        a { color: #3897f0; text-decoration: none; font-weight: bold; font-size: 13px; background: #2c2c2e; padding: 6px 12px; border-radius: 6px; }
        .count { text-align: center; font-size: 15px; color: #ff453a; margin-bottom: 15px; font-weight: bold; }
        .error { color: #ff453a; background: #2c1c1c; padding: 12px; border-radius: 10px; margin-top: 10px; text-align: center; font-size: 14px; border: 1px solid #5a2222; }
        .success { color: #30d158; background: #1c2c1c; padding: 12px; border-radius: 10px; margin-top: 10px; text-align: center; font-size: 14px; border: 1px solid #225a22; }
    </style>
</head>
<body>

    <h1>Insta Unfollower Checker</h1>

    <div class="box">
        <label>1. Datei wählen: <code>followers_1.json</code></label>
        <input type="file" id="followersFile" accept=".json">
    </div>

    <div class="box">
        <label>2. Datei wählen: <code>following.json</code></label>
        <input type="file" id="followingFile" accept=".json">
    </div>

    <button onclick="analyze()">Auswerten</button>

    <div class="results" id="output"></div>

    <script>
        // Universelle Funktion zum Auslesen von Usernames aus Meta-JSON
        function extractUsernames(jsonObj) {
            let usernames = new Set();

            function recursiveSearch(obj) {
                if (!obj) return;

                if (Array.isArray(obj)) {
                    obj.forEach(item => recursiveSearch(item));
                } else if (typeof obj === 'object') {
                    // Typische Instagram JSON Struktur prüfen
                    if (obj.string_list_data && Array.isArray(obj.string_list_data)) {
                        obj.string_list_data.forEach(subItem => {
                            if (subItem.value) usernames.add(subItem.value.toLowerCase().trim());
                        });
                    }
                    if (obj.value) {
                        usernames.add(obj.value.toLowerCase().trim());
                    }
                    if (obj.title && typeof obj.title === 'string' && !obj.title.includes(' ')) {
                        usernames.add(obj.title.toLowerCase().trim());
                    }

                    // Rekursiv weiter durchsuchen
                    for (let key in obj) {
                        if (obj.hasOwnProperty(key)) {
                            recursiveSearch(obj[key]);
                        }
                    }
                }
            }

            recursiveSearch(jsonObj);
            return usernames;
        }

        function analyze() {
            const fFileInput = document.getElementById('followersFile');
            const fgFileInput = document.getElementById('followingFile');
            const output = document.getElementById('output');

            output.innerHTML = '';

            const fFile = fFileInput.files[0];
            const fgFile = fgFileInput.files[0];

            if (!fFile || !fgFile) {
                output.innerHTML = '<div class="error">Bitte wähle beide JSON-Dateien aus!</div>';
                return;
            }

            Promise.all([fFile.text(), fgFile.text()])
                .then(([fText, fgText]) => {
                    let followersData, followingData;

                    try {
                        followersData = JSON.parse(fText);
                    } catch (e) {
                        output.innerHTML = '<div class="error">Fehler: Die Datei "followers_1.json" ist ungültig oder beschädigt.</div>';
                        return;
                    }

                    try {
                        followingData = JSON.parse(fgText);
                    } catch (e) {
                        output.innerHTML = '<div class="error">Fehler: Die Datei "following.json" ist ungültig oder beschädigt.</div>';
                        return;
                    }

                    const followersSet = extractUsernames(followersData);
                    const followingSet = extractUsernames(followingData);

                    if (followersSet.size === 0) {
                        output.innerHTML = '<div class="error">Keine Follower in "followers_1.json" gefunden. Bitte prüfe, ob du die richtige Datei gewählt hast.</div>';
                        return;
                    }

                    if (followingSet.size === 0) {
                        output.innerHTML = '<div class="error">Keine gefolgten Konten in "following.json" gefunden. Bitte prüfe, ob du die richtige Datei gewählt hast.</div>';
                        return;
                    }

                    let notFollowingBack = [];
                    followingSet.forEach(user => {
                        if (!followersSet.has(user)) {
                            notFollowingBack.push(user);
                        }
                    });

                    // Sortieren nach Name
                    notFollowingBack.sort();

                    if (notFollowingBack.length === 0) {
                        output.innerHTML = '<div class="success">🎉 Super! Alle Personen, denen du folgst, folgen dir auch zurück.</div>';
                    } else {
                        let html = `<div class="count">${notFollowingBack.length} Personen folgen dir nicht zurück:</div><ul>`;
                        notFollowingBack.forEach(username => {
                            html += `<li>
                                <span>@${username}</span>
                                <a href="https://instagram.com/${username}" target="_blank" rel="noopener">Profil</a>
                            </li>`;
                        });
                        html += '</ul>';
                        output.innerHTML = html;
                    }
                })
                .catch(err => {
                    output.innerHTML = `<div class="error">Systemfehler beim Lesen der Dateien: ${err.message}</div>`;
                });
        }
    </script>
</body>
</html>
